name: project-mirror-foundation

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror_compose_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mirror-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mirror-redis:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &foundation-environment
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://mirror:mirror_compose_only@postgres:5432/mirror
      REDIS_URL: redis://redis:6379/0
      TASK_RUNNER: celery
      SMS_PROVIDER: mock
      STORAGE_PROVIDER: local
      VISION_PROVIDER: mock
      IMAGE_GENERATION_PROVIDER: mock
      SYNTHETIC_STORAGE_PROVIDER: local
      AGENT_PROVIDER: mock
      OBJECT_STORAGE_PRIVATE: "true"
      SENSITIVE_PROCESSING_ENABLED: "false"
      LOCAL_STORAGE_ROOT: /var/lib/mirror-private
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn mirror_api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    ports:
      - "8000:8000"
    volumes:
      - mirror-private:/var/lib/mirror-private

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *foundation-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - mirror_worker.app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=mirror.default,mirror.ingestion,mirror.synthetic,mirror.maintenance,mirror.demo
      - --concurrency=2
      - --prefetch-multiplier=1
    volumes:
      - mirror-private:/var/lib/mirror-private
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A mirror_worker.app:celery_app inspect ping
          --destination "celery@$$(hostname)" --timeout=2
      interval: 10s
      timeout: 12s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    ports:
      - "3000:3000"

volumes:
  mirror-postgres:
  mirror-redis:
  mirror-private:
