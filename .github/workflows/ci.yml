name: project-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: mirror_test
          POSTGRES_USER: mirror
          POSTGRES_PASSWORD: mirror_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirror -d mirror_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://mirror:mirror_ci_only@127.0.0.1:5432/mirror_test
      TEST_DATABASE_URL: postgresql+psycopg://mirror:mirror_ci_only@127.0.0.1:5432/mirror_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RUN_CELERY_INTEGRATION: "true"
      TASK_RUNNER: celery
      SMS_PROVIDER: mock
      STORAGE_PROVIDER: local
      VISION_PROVIDER: mock
      IMAGE_GENERATION_PROVIDER: mock
      SYNTHETIC_STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /tmp/mirror-ci-synthetic
      AGENT_PROVIDER: mock
      OBJECT_STORAGE_PRIVATE: "true"
      SENSITIVE_PROCESSING_ENABLED: "false"
      CI: "true"
      PYTHONPATH: services/api/src:services/worker/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-supply-chain.txt
          pnpm install --frozen-lockfile
      - name: Python quality
        run: |
          python -m ruff format --check services
          python -m ruff check services
          python -m mypy services/api/src services/worker/src
      - name: PostgreSQL migration lifecycle
        run: |
          python -m alembic -c services/api/alembic.ini downgrade base
          python -m alembic -c services/api/alembic.ini upgrade head
          python -m alembic -c services/api/alembic.ini downgrade base
          python -m alembic -c services/api/alembic.ini upgrade head
          python -m alembic -c services/api/alembic.ini check
      - name: Start Linux Celery worker
        run: |
          celery -A mirror_worker.app:celery_app worker --loglevel=INFO --pool=solo \
            --queues=mirror.default,mirror.ingestion,mirror.synthetic,mirror.maintenance \
            --prefetch-multiplier=1 > celery.log 2>&1 &
          echo $! > celery.pid
      - name: Python tests
        run: python -m pytest services/api/tests services/worker/tests
      - name: Phase 1 vertical integration and recovery
        run: >-
          python -m pytest services/worker/tests/test_phase1_vertical.py
          --junitxml=phase1-integration-results.xml
      - name: P2-M1 deterministic and boundary evidence tests
        run: >-
          python -m pytest
          services/api/tests/test_p2_m1_security_boundaries.py
          services/api/tests/test_synthetic_dataset_domain.py
          services/api/tests/test_synthetic_dataset_foundation_invariants.py
          services/api/tests/test_providers.py
          services/api/tests/test_config.py
          services/api/tests/test_p2_m1_ci_evidence.py
          --junitxml=p2-m1-results.xml
      - name: P2-M2 deterministic integration and boundary evidence tests
        run: >-
          python -m pytest
          services/api/tests/test_p2_m2_security_boundaries.py
          services/api/tests/test_generation_batch_foundation_invariants.py
          services/api/tests/test_generation_batch_service.py
          services/api/tests/test_synthetic_raw_storage.py
          services/api/tests/test_codex_native_source_admission.py
          services/worker/tests/test_synthetic_generation_worker.py
          services/api/tests/test_p2_m2_ci_evidence.py
          --junitxml=p2-m2-results.xml
      - name: P2-M3 deterministic integration and boundary evidence tests
        run: >-
          python -m pytest
          services/api/tests/test_synthetic_asset_qa_invariants.py
          services/api/tests/test_offline_synthetic_source_authority_invariants.py
          services/api/tests/test_synthetic_normalization.py
          services/api/tests/test_synthetic_normalized_storage.py
          services/api/tests/test_synthetic_qa_domain.py
          services/api/tests/test_synthetic_qa_service_integration.py
          services/api/tests/test_synthetic_m3_orchestration.py
          services/worker/tests/test_synthetic_m3_worker.py
          services/api/tests/test_p2_m3_ci_evidence.py
          --junitxml=p2-m3-results.xml
      - name: TypeScript quality and build
        run: pnpm check
      - name: Install Playwright Chromium system dependencies
        # Three bounded 600-second attempts plus 30/60-second backoff fit in
        # this independent runner watchdog while leaving cleanup headroom.
        # Retrying in the same runner preserves any apt indexes downloaded by
        # an earlier attempt without repeating this work during browser download.
        timeout-minutes: 35
        shell: bash
        env:
          PLAYWRIGHT_INSTALL_LOG: ${{ runner.temp }}/playwright-chromium-install.log
        run: |
          set -euo pipefail
          readonly max_attempts=3
          readonly timeout_seconds=600
          readonly -a backoff_seconds=(30 60)
          playwright_version="$(pnpm --filter @mirror/web exec playwright --version)"
          playwright_version="${playwright_version#Version }"
          : > "$PLAYWRIGHT_INSTALL_LOG"

          for attempt in $(seq 1 "$max_attempts"); do
            start_epoch="$(date +%s)"
            start_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'event=playwright_system_dependencies attempt=%s/%s start=%s timeout_seconds=%s version=%q\n' \
              "$attempt" "$max_attempts" "$start_timestamp" "$timeout_seconds" "$playwright_version" \
              | tee -a "$PLAYWRIGHT_INSTALL_LOG"

            set +e
            timeout --signal=TERM --kill-after=30s "${timeout_seconds}s" \
              bash -o pipefail -c '
                pnpm --filter @mirror/web exec playwright install-deps chromium 2>&1 \
                  | sed -E \
                    -e "s#file:/[^[:space:]]+#<redacted-file-uri>#g" \
                    -e "s#(^|[^[:alnum:]_:/.-])/[A-Za-z0-9_./-]+#\\1<redacted-path>#g" \
                    -e "s#([A-Za-z]:\\\\|\\\\\\\\)[^[:space:]]+#<redacted-path>#g" \
                  | tee -a "$PLAYWRIGHT_INSTALL_LOG"
                exit "${PIPESTATUS[0]}"
              '
            install_status="$?"
            set -e

            end_epoch="$(date +%s)"
            end_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            elapsed_seconds="$((end_epoch - start_epoch))"
            printf 'event=playwright_system_dependencies attempt=%s/%s end=%s elapsed_seconds=%s exit_status=%s\n' \
              "$attempt" "$max_attempts" "$end_timestamp" "$elapsed_seconds" "$install_status" \
              | tee -a "$PLAYWRIGHT_INSTALL_LOG"

            if [[ "$install_status" -eq 0 ]]; then
              exit 0
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              backoff="${backoff_seconds[$((attempt - 1))]}"
              printf 'event=playwright_system_dependencies retry_after_seconds=%s\n' "$backoff" \
                | tee -a "$PLAYWRIGHT_INSTALL_LOG"
              sleep "$backoff"
            fi
          done

          printf 'event=playwright_system_dependencies outcome=failed attempts=%s\n' "$max_attempts" \
            | tee -a "$PLAYWRIGHT_INSTALL_LOG"
          exit 1
      - name: Download Playwright Chromium
        # Three bounded 600-second attempts plus 30/60-second backoff fit in
        # this independent runner watchdog while leaving cleanup headroom.
        timeout-minutes: 35
        shell: bash
        env:
          PLAYWRIGHT_INSTALL_LOG: ${{ runner.temp }}/playwright-chromium-install.log
        run: |
          set -euo pipefail
          readonly max_attempts=3
          readonly timeout_seconds=600
          readonly -a backoff_seconds=(30 60)
          playwright_version="$(pnpm --filter @mirror/web exec playwright --version)"
          playwright_version="${playwright_version#Version }"

          # Do not allow a repository or runner override to replace Playwright's
          # official browser download endpoints.
          unset PLAYWRIGHT_DOWNLOAD_HOST PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST

          for attempt in $(seq 1 "$max_attempts"); do
            start_epoch="$(date +%s)"
            start_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'event=playwright_chromium_download attempt=%s/%s start=%s timeout_seconds=%s version=%q\n' \
              "$attempt" "$max_attempts" "$start_timestamp" "$timeout_seconds" "$playwright_version" \
              | tee -a "$PLAYWRIGHT_INSTALL_LOG"

            set +e
            timeout --signal=TERM --kill-after=30s "${timeout_seconds}s" \
              bash -o pipefail -c '
                pnpm --filter @mirror/web exec playwright install chromium 2>&1 \
                  | sed -E \
                    -e "s#file:/[^[:space:]]+#<redacted-file-uri>#g" \
                    -e "s#(^|[^[:alnum:]_:/.-])/[A-Za-z0-9_./-]+#\\1<redacted-path>#g" \
                    -e "s#([A-Za-z]:\\\\|\\\\\\\\)[^[:space:]]+#<redacted-path>#g" \
                  | tee -a "$PLAYWRIGHT_INSTALL_LOG"
                exit "${PIPESTATUS[0]}"
              '
            install_status="$?"
            set -e

            end_epoch="$(date +%s)"
            end_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            elapsed_seconds="$((end_epoch - start_epoch))"
            printf 'event=playwright_chromium_download attempt=%s/%s end=%s elapsed_seconds=%s exit_status=%s\n' \
              "$attempt" "$max_attempts" "$end_timestamp" "$elapsed_seconds" "$install_status" \
              | tee -a "$PLAYWRIGHT_INSTALL_LOG"

            if [[ "$install_status" -eq 0 ]]; then
              exit 0
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              backoff="${backoff_seconds[$((attempt - 1))]}"
              printf 'event=playwright_chromium_download retry_after_seconds=%s\n' "$backoff" \
                | tee -a "$PLAYWRIGHT_INSTALL_LOG"
              sleep "$backoff"
            fi
          done

          printf 'event=playwright_chromium_download outcome=failed attempts=%s\n' "$max_attempts" \
            | tee -a "$PLAYWRIGHT_INSTALL_LOG"
          exit 1
      - name: Upload Playwright install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-install-evidence
          path: ${{ runner.temp }}/playwright-chromium-install.log
          if-no-files-found: error
          retention-days: 14
      - name: Browser integration
        run: pnpm --filter @mirror/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - name: Contract regeneration drift
        run: |
          python -m mirror_api.scripts.export_openapi
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/schema.ts
      - name: Generate Phase 1 CI evidence
        run: |
          python -m alembic -c services/api/alembic.ini heads > phase1-migration-head.txt
          python -m mirror_api.scripts.phase1_ci_evidence \
            --commit-sha "$GITHUB_SHA" \
            --migration-head-file phase1-migration-head.txt \
            --expected-migration-head 0014_m5_eval_authority \
            --openapi packages/contracts/openapi.json \
            --test-results phase1-integration-results.xml \
            --output phase1-ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-ci-evidence
          path: phase1-ci-evidence.json
      - name: Generate P2-M1 CI evidence
        run: |
          python -m alembic -c services/api/alembic.ini heads > p2-m1-migration-head.txt
          python -m mirror_api.scripts.p2_m1_ci_evidence \
            --commit-sha "$GITHUB_SHA" \
            --migration-head-file p2-m1-migration-head.txt \
            --expected-migration-head 0014_m5_eval_authority \
            --openapi packages/contracts/openapi.json \
            --test-results p2-m1-results.xml \
            --output p2-m1-ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-m1-ci-evidence
          path: p2-m1-ci-evidence.json
      - name: Generate P2-M2 CI evidence
        run: |
          python -m alembic -c services/api/alembic.ini heads > p2-m2-migration-head.txt
          python -m mirror_api.scripts.p2_m2_ci_evidence \
            --commit-sha "$GITHUB_SHA" \
            --migration-head-file p2-m2-migration-head.txt \
            --expected-migration-head 0014_m5_eval_authority \
            --openapi packages/contracts/openapi.json \
            --test-results p2-m2-results.xml \
            --output p2-m2-ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-m2-ci-evidence
          path: p2-m2-ci-evidence.json
      - name: Generate P2-M3 CI evidence
        run: |
          python -m alembic -c services/api/alembic.ini heads > p2-m3-migration-head.txt
          python -m mirror_api.scripts.p2_m3_ci_evidence \
            --commit-sha "$GITHUB_SHA" \
            --migration-head-file p2-m3-migration-head.txt \
            --expected-migration-head 0014_m5_eval_authority \
            --openapi packages/contracts/openapi.json \
            --test-results p2-m3-results.xml \
            --holdout-evidence docs/operations/P2_M3_V03_HOLDOUT_REDACTED_EVIDENCE.json \
            --authority-evidence docs/operations/P2_M3_V03_AUTHORITY_REDACTED_EVIDENCE.json \
            --v01-evidence docs/operations/P2_M3_V01_NORMALIZATION_REDACTED_EVIDENCE.json \
            --v01-correction docs/operations/P2_M3_V01_MIGRATION_HEAD_CORRECTION.json \
            --output p2-m3-ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2-m3-ci-evidence
          path: p2-m3-ci-evidence.json
      - name: Dependency and license audits
        id: dependency_and_license_audits
        run: |
          set -o pipefail
          pip-audit --local
          pnpm audit --audit-level high
          pip-licenses --format=json --output-file=python-licenses.json
          node_license_candidate=.node-licenses.candidate.json
          if [ -e "$node_license_candidate" ] || [ -e node-licenses.json ]; then
            echo "node license artifact candidate or final target already exists" >&2
            exit 1
          fi
          if ! pnpm licenses list --json | node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(0, "utf8")); for (const packages of Object.values(report)) { for (const packageRecord of packages) { delete packageRecord.paths; } } process.stdout.write(`${JSON.stringify(report, null, 2)}\n`);' > "$node_license_candidate"; then
            echo "node license inventory or sanitizer failed" >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const licenseGroups = Object.keys(report).length; let packageRecords = 0; let pathFields = 0; let absolutePathStrings = 0; for (const packages of Object.values(report)) { if (!Array.isArray(packages)) throw new Error("node license artifact has a non-array license group"); packageRecords += packages.length; } const visit = (value) => { if (typeof value === "string") { if (/^\//.test(value) || /^[A-Za-z]:[\\/]/.test(value) || /^\\\\/.test(value) || /^file:/i.test(value)) absolutePathStrings += 1; return; } if (Array.isArray(value)) { for (const item of value) visit(item); return; } if (value && typeof value === "object") { if (Object.hasOwn(value, "paths")) pathFields += 1; for (const item of Object.values(value)) visit(item); } }; visit(report); if (licenseGroups === 0 || packageRecords === 0 || pathFields !== 0 || absolutePathStrings !== 0) throw new Error(`node license artifact redaction failed: license_groups=${licenseGroups} package_records=${packageRecords} paths=${pathFields} absolute_paths=${absolutePathStrings}`); console.log(`node license artifact redaction: license_groups=${licenseGroups} package_records=${packageRecords} paths=0 absolute_paths=0`);' "$node_license_candidate"
          node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); const source = process.argv[1]; const target = process.argv[2]; let linked = false; try { fs.linkSync(source, target); linked = true; const sourceBytes = fs.readFileSync(source); const targetBytes = fs.readFileSync(target); const digest = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex"); if (sourceBytes.length !== targetBytes.length || digest(sourceBytes) !== digest(targetBytes)) throw new Error("node license artifact promotion digest mismatch"); fs.unlinkSync(source); console.log(`node license artifact promotion: byte_size=${targetBytes.length} digest_match=true`); } catch (error) { if (linked) { try { fs.unlinkSync(target); } catch {} } throw error; }' "$node_license_candidate" node-licenses.json
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file python-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.dependency_and_license_audits.outcome == 'success' }}
        with:
          name: project-audit-evidence
          path: |
            celery.log
            python-licenses.json
            node-licenses.json
            python-sbom.cdx.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose -f compose.yaml config --quiet
      - name: Build Project images
        run: docker compose -f compose.yaml build
      - name: Start Project topology
        run: docker compose -f compose.yaml up -d --wait
      - name: Validate container behavior
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8000/health/live
          curl --fail --show-error --silent http://127.0.0.1:8000/health/ready
          curl --fail --show-error --silent http://127.0.0.1:3000/
          docker compose -f compose.yaml exec -T worker \
            celery -A mirror_worker.app:celery_app inspect ping --timeout=10
          docker compose -f compose.yaml exec -T \
            -e RUN_CELERY_INTEGRATION=true \
            -e TEST_DATABASE_URL=postgresql+psycopg://mirror:mirror_compose_only@postgres:5432/mirror \
            worker \
            python -m pytest tests -q
          docker compose -f compose.yaml exec -T api alembic check
      - name: Capture container evidence
        if: always()
        shell: bash
        run: |
          set -o pipefail
          docker compose -f compose.yaml ps --all
          docker compose -f compose.yaml logs --no-color \
            | sed -E \
              -e "s#file:/[^[:space:]]+#<redacted-file-uri>#g" \
              -e "s#(^|[^[:alnum:]_:/.-])/[A-Za-z0-9_./-]+#\\1<redacted-path>#g" \
              -e "s#([A-Za-z]:\\\\|\\\\\\\\)[^[:space:]]+#<redacted-path>#g" \
            > docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-docker-evidence
          path: docker-compose.log
      - name: Stop Project topology
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
