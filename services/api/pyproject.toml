[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mirror-api"
version = "0.1.0"
description = "Project Mirror HTTP API and domain foundation"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=12.3,<13",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-json-logger>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
mirror-api = "mirror_api.__main__:run"
mirror-dataset = "mirror_api.scripts.mirror_dataset:run"
mirror-openapi = "mirror_api.scripts.export_openapi:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings -p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["B008", "RUF001", "S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
