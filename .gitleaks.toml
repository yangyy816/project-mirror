title = "Project Mirror Gitleaks exceptions"

[extend]
useDefault = true

# P1-M4-R08: exact historical test-only false positive. The source was replaced in
# 0d8c9e4; all three predicates must match so no current or unrelated finding is ignored.
[[allowlists]]
description = "Historical synthetic idempotency fixture in 192610b"
condition = "AND"
commits = ["192610b5f8289d288aa2787561aeb09a861f9a8a"]
paths = ['''^services/api/tests/test_ingestion_dispatch\.py$''']
regexTarget = "match"
regexes = ['''idempotency_key="coordinator-key-2"''']

# P3-P7-CI-R01: Gitleaks 8.28.0 classifies this historical public OpenAPI
# contract digest as a generic key.  The next commit renamed the evidence field;
# keep this exception bound to the exact old commit, path, and public digest.
[[allowlists]]
description = "Historical readiness OpenAPI digest false positive in 1c127dc"
condition = "AND"
commits = ["1c127dcf5ff3ce3d497eae9c2740d06714e988bf"]
paths = ['''^docs/operations/P2_M8_M9_READINESS\.md$''']
regexTarget = "match"
regexes = ['''READINESS_CANDIDATE_OPENAPI_SHA256: a9ee1e0ad3b942e5be5790b4fc7ff8c0deab744a84d3383a7a8856a8f97b4841''']

# P3-P7-D02-R2-R01: Gitleaks 8.28.0 classifies this historical synthetic
# idempotency test key as a generic API key. The next local commit replaced the
# literal; bind the exception to the exact old commit, test path, and match.
[[allowlists]]
description = "Historical D02-R2 synthetic idempotency-key false positive in 5323f85"
condition = "AND"
commits = ["5323f853838f9b48a0bf9a9d037ca9048e7cb2c7"]
paths = ['''^services/api/tests/test_demo_d02_r2_epoch2_admission\.py$''']
regexTarget = "match"
regexes = ['''idempotency_key="epoch2-admission-key"''']

# P2-M5-CC05-R01: an unrelated fetched formal branch contains one historical
# public OpenAPI digest under a field name that Gitleaks classifies as a generic
# key. A subsequent commit renamed it; keep the exception exact and historical.
[[allowlists]]
description = "Historical formal QuestionBank OpenAPI digest false positive in 0500b9e"
condition = "AND"
commits = ["0500b9e60822d81811f85f2926534b26ad86a088"]
paths = ['''^docs/research/P2_QUESTIONBANK_GENERATION_POLICY_V3\.json$''']
regexTarget = "match"
regexes = ['''71942e2bdd3ff8896f6c74e7ee2f562167cb635528d9d802b7d66c460b0f13cf''']
