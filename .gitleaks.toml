# D10-CI-R01: these two tracked source lines compare a parsed handle schema
# against static key-name sets. They are not handles, locators, Prompt data, or
# credential material.
[[allowlists]]
description = "D10 successor: historical static V1 capture handle-key set assignment in 5452af4"
condition = "AND"
commits = ["5452af4337a2bd462f31a213ddc439d291ab2362"]
