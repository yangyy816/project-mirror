# D02-CI-R02: deterministic test-only idempotency values are not credentials.
# Keep both exceptions bound to their exact immutable source commits and paths.
[[allowlists]]
description = "Historical D06 deterministic collision-key false positive"
condition = "AND"
commits = ["53cbac335a6a0008fbb4395a10715d0e6512d1ad"]
paths = ['''^services/api/tests/test_demo_self_transfer_service\.py$''']
regexTarget = "match"
regexes = ['''key="d06-result-collision"''']

[[allowlists]]
description = "Historical D07 deterministic idempotency-key false positives"
condition = "AND"
commits = [
  "186db65e3e1ad5a7f78b284a060d8d25de20cc99",
  "a8907b7b580d7e4ce699fa5f067512c8501204cc",
